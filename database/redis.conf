bind 0.0.0.0
protected-mode yes
dir /data
appendonly yes
# Todos arrancan como maestros independientes; la capa de coordinación (Taller 1) ejecuta REPLICAOF
# para que las réplicas sigan al líder elegido.
replica-read-only yes
# Modo CP opcional (el maestro rechaza escribir sin réplicas):
# min-replicas-to-write 1
# min-replicas-max-lag 5
